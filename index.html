<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Cobro Directo</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #30363d;
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        #mensaje {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Terminal de Cobro</h2>
    
    <form id="paymentForm">
        <div class="form-group">
            <label for="amount">Monto a Cobrar ($)</label>
            <input type="number" id="amount" value="100" min="1" required>
        </div>

        <div class="form-group">
            <label for="email">Email del Cliente</label>
            <input type="email" id="email" value="cliente@email.com" required>
        </div>

        <div class="form-group">
            <label for="cardNumber">Número de Tarjeta</label>
            <input type="text" id="cardNumber" data-mp="cardNumber" placeholder="1234 5678 9012 3456" required>
        </div>

        <div class="form-group">
            <label for="cardExpirationMonth">Vencimiento (MM/AA)</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="cardExpirationMonth" data-mp="cardExpirationMonth" placeholder="MM" maxlength="2" required>
                <input type="text" id="cardExpirationYear" data-mp="cardExpirationYear" placeholder="AA" maxlength="2" required>
            </div>
        </div>

        <div class="form-group">
            <label for="securityCode">Código de Seguridad (CVV)</label>
            <input type="text" id="securityCode" data-mp="securityCode" placeholder="123" maxlength="4" required>
        </div>

        <div class="form-group">
            <label for="cardholderName">Nombre del Titular</label>
            <input type="text" id="cardholderName" data-mp="cardholderName" placeholder="Como figura en la tarjeta" required>
        </div>

        <div class="form-group">
            <label for="docType">Tipo de Documento</label>
            <select id="docType" data-mp="docType">
                <option value="DNI">DNI</option>
                <option value="LC">LC</option>
                <option value="LE">LE</option>
                <option value="PAS">Pasaporte</option>
            </select>
        </div>

        <div class="form-group">
            <label for="docNumber">Número de Documento</label>
            <input type="text" id="docNumber" data-mp="docNumber" placeholder="Número sin puntos" required>
        </div>

        <!-- Campo oculto para cuotas -->
        <select id="installments" data-mp="installments" style="display: none;"></select>

        <button type="submit" id="payButton">Pagar</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // Tu Public Key de Producción (reemplazá con la tuya si hace falta)
    const mp = new MercadoPago('APP_USR-b635e795-bd67-4a39-bd3e-6ac868765a83');

    const cardForm = mp.cardForm({
        amount: "100",
        iframe: true,
        form: {
            id: "paymentForm",
            cardholderName: { id: "cardholderName" },
            cardholderEmail: { id: "email" },
            cardNumber: { id: "cardNumber" },
            cardExpirationMonth: { id: "cardExpirationMonth" },
            cardExpirationYear: { id: "cardExpirationYear" },
            securityCode: { id: "securityCode" },
            identificationType: { id: "docType" },
            identificationNumber: { id: "docNumber" },
            installments: { id: "installments" }
        },
        callbacks: {
            onFormMounted: error => {
                if (error) console.warn("Form mounted error: ", error);
            },
            onSubmit: event => {
                event.preventDefault();
                
                const {
                    paymentMethodId: payment_method_id,
                    cardholderEmail: email,
                    token,
                    installments,
                    identificationType,
                    identificationNumber,
                } = cardForm.getCardFormData();

                const mensajeDiv = document.getElementById('mensaje');
                mensajeDiv.style.color = '#58a6ff';
                mensajeDiv.innerText = "Procesando pago...";

                fetch('/api/process-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        payment_method_id,
                        transaction_amount: Number(document.getElementById('amount').value),
                        installments: Number(installments || 1),
                        email: document.getElementById('email').value,
                        identification: {
                            type: identificationType,
                            number: identificationNumber
                        }
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success && (data.status === 'approved' || data.status == 'in_process')) {
                        mensajeDiv.style.color = '#2ea043';
                        mensajeDiv.innerText = `¡Pago Exitoso! Estado: ${data.status}`;
                    } else {
                        mensajeDiv.style.color = '#f85149';
                        mensajeDiv.innerText = `Rechazado: ${data.error || data.status_detail || 'Verifique los datos'}`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    mensajeDiv.style.color = '#f85149';
                    mensajeDiv.innerText = "Error de conexión al procesar.";
                });
            }
        }
    });
</script>

</body>
</html>
