<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Cobro Directo</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #30363d;
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }
        #cardPaymentBrick_container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Terminal de Cobro Directo</h2>
    
    <div class="form-group">
        <label for="amount">MONTO A COBRAR ($)</label>
        <input type="number" id="amount" value="100" min="1">
    </div>

    <div class="form-group">
        <label for="email">EMAIL DEL CLIENTE</label>
        <input type="email" id="email" placeholder="cliente@email.com" value="cliente@email.com">
    </div>

    <div id="cardPaymentBrick_container"></div>
</div>

<script>
    // IMPORTANTE: Tu Public Key de Mercado Pago (APP_USR-...)
    const mp = new MercadoPago('APP_USR-b635e795-bd67-4a39-bd3e-6ac868765a83', {
        locale: 'es-AR'
    });
    
    const bricksBuilder = mp.bricks();

    const renderCardBrick = async (bricksBuilder) => {
        const settings = {
            initialization: {
                amount: Number(document.getElementById('amount').value),
            },
            customization: {
                visual: {
                    style: {
                        theme: 'dark'
                    }
                }
            },
            callbacks: {
                onReady: () => {
                    console.log('Brick de pago cargado correctamente');
                },
                onSubmit: async ({ selectedPaymentMethod, formData }) => {
                    try {
                        formData.transaction_amount = Number(document.getElementById('amount').value);
                        formData.payer = formData.payer || {};
                        formData.payer.email = document.getElementById('email').value;

                        const response = await fetch('/api/process-payment', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(formData),
                        });

                        const data = await response.json();

                        if (data.success && (data.status === 'approved' || data.status === 'in_process')) {
                            alert('¡Pago Exitoso! Estado: ' + data.status);
                        } else {
                            alert('El pago no se pudo completar: ' + (data.error || data.status_detail || 'Rechazado'));
                        }
                    } catch (err) {
                        console.error("Error de red:", err);
                        alert('Error de conexión al enviar el pago.');
                    }
                },
                onError: (error) => {
                    console.error('Error en Brick:', error);
                },
            },
        };
        window.cardBrickController = await bricksBuilder.create(
            'cardPayment',
            'cardPaymentBrick_container',
            settings
        );
    };

    renderCardBrick(bricksBuilder);
</script>

</body>
</html>
