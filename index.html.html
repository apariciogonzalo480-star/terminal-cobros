<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Cobro - Mercado Pago</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-md w-full space-y-4">
        <h1 class="text-xl font-bold text-blue-500 border-b border-slate-800 pb-3">
            💳 Terminal de Cobro Directo
        </h1>

        <div>
            <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Monto a Cobrar ($)</label>
            <input type="number" id="amount" value="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-2xl font-bold text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
            <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Email del Cliente</label>
            <input type="email" id="payer-email" value="cliente@gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <!-- Contenedor del Formulario de Tarjeta de Mercado Pago -->
        <div id="cardPaymentBrick_container"></div>

        <p id="payment-status" class="text-center font-bold text-sm hidden"></p>
    </div>

    <script>
        // Inicializar SDK con tu Public Key de Producción
        const mp = new MercadoPago('TU_PUBLIC_KEY_AQUI', {
            locale: 'es-AR'
        });

        const bricksBuilder = mp.bricks();

        const renderCardPaymentBrick = async (bricksBuilder) => {
            const settings = {
                initialization: {
                    amount: Number(document.getElementById('amount').value),
                },
                customization: {
                    visual: {
                        style: {
                            theme: 'dark'
                        }
                    }
                },
                callbacks: {
                    onReady: () => {
                        console.log('Brick listo');
                    },
                    onSubmit: (cardFormData) => {
                        return new Promise((resolve, reject) => {
                            fetch("http://localhost:3000/api/process-payment", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify({
                                    ...cardFormData,
                                    email: document.getElementById('payer-email').value
                                }),
                            })
                            .then((response) => response.json())
                            .then((data) => {
                                const statusLbl = document.getElementById('payment-status');
                                statusLbl.classList.remove('hidden');
                                if(data.status === 'approved') {
                                    statusLbl.className = 'text-emerald-400 text-center font-bold mt-4';
                                    statusLbl.innerText = '¡Cobro Aprobado y Acreditado!';
                                } else {
                                    statusLbl.className = 'text-rose-400 text-center font-bold mt-4';
                                    statusLbl.innerText = 'Pago no procesado: ' + (data.status || 'Rechazado');
                                }
                                resolve();
                            })
                            .catch((error) => {
                                console.error(error);
                                reject();
                            });
                        });
                    },
                    onError: (error) => {
                        console.error(error);
                    },
                },
            };
            window.cardPaymentBrickController = await bricksBuilder.create(
                'cardPayment',
                'cardPaymentBrick_container',
                settings
            );
        };

        renderCardPaymentBrick(bricksBuilder);
    </script>
</body>
</html>
